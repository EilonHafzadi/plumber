name: Plumber CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build plumber
        run: go build ./...

      - name: Run tests
        run: go test ./...
