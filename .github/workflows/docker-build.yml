name: Build and Push Docker Image

on:
  push:
    branches:
      - main # Triggers the build on every push to the main branch
  pull_request:
    branches:
      - main # Tests the build on pull requests before merging

permissions:
  contents: read
  packages: write # Required to push to GitHub Container Registry

jobs:
  build-and-push:
    runs-on: alpine-latest

    steps:
      # Step 1: Check out the repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for advanced caching features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Automatically generate optimized tags and labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Step 5: Build the Dockerfile and push it to the registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # Speeds up subsequent runs using GitHub Actions cache
          cache-to: type=gha,mode=max
